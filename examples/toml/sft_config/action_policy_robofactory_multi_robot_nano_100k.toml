# Formal 100k-step ImageWAM-contract RoboFactory multi-robot SFT run.
# Required env: ROBOFACTORY_ROOT, ROBOFACTORY_GAUSSIAN_CACHE_ROOT,
# ROBOFACTORY_ACTION_STATS_PATH, BASE_CHECKPOINT_PATH, WAN_VAE_PATH,
# QWEN3_VL_TOKENIZER_PATH, and IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_robofactory_multi_robot_nano"
project      = "cosmos3_action_robofactory_multi_robot"
group        = "ITER-2026-08-30-COSMOS3-ROBOFACTORY-MR"
name         = "ITER-2026-08-30-COSMOS3-ROBOFACTORY-MR"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [100000]
warm_up_steps = [0]

[trainer]
max_iter        = 100000
logging_iter    = 1
grad_accum_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 5000
