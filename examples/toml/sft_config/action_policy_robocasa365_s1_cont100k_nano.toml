# Continue E35-S1 from optimizer step 10,000 to 100,000. The original
# 16,000-step schedule is replaced because that schedule is undefined after
# its final cycle. Its multiplier at step 10,000 is 6000 / 15500.

[job]
task         = "vfm"
experiment   = "action_policy_robocasa365_s1_nano"
project      = "cosmos3_action_robocasa365"
group        = "action_sft"
name         = "action_policy_robocasa365_s1_cont100k_nano"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "${oc.env:CWAM_ACTIVATION_CHECKPOINTING_MODE,selective}"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [90000]
warm_up_steps = [0]
f_start = [0.3870967741935484]
f_max = [0.3870967741935484]
f_min = [0.0]

[trainer]
max_iter        = 100000
logging_iter    = 50
grad_accum_iter = 2

[checkpoint]
load_path = "${oc.env:RESUME_CHECKPOINT_PATH}"
save_iter = 10000
