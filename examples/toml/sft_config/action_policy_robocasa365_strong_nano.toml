# E35-Strong-v1: native three-camera input on the 480 model canvas, 16-D
# proprioception, masked causal action history, and a four-layer action tower.
# The source cameras remain native 256x256; 480 is a preprocessing tier, not a
# claim that the source contains higher-frequency image information.

[job]
task         = "vfm"
experiment   = "action_policy_robocasa365_strong_nano"
project      = "cosmos3_action_robocasa365"
group        = "action_sft"
name         = "action_policy_robocasa365_strong_nano"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "${oc.env:CWAM_ACTIVATION_CHECKPOINTING_MODE,selective}"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [20000]
warm_up_steps = [500]

[trainer]
max_iter        = 20000
logging_iter    = 50
grad_accum_iter = 2

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
