# B3: retain every B2 data, model, optimizer, and auxiliary-objective choice,
# but constrain relation-aware context attention with matched-budget DSelect-k
# support. SmoothStep selectors are regularized toward at-most-32 positions.

[job]
task         = "vfm"
experiment   = "action_policy_robocasa365_b3_dselect_nano"
project      = "cosmos3_action_robocasa365"
group        = "action_sft"
name         = "action_policy_robocasa365_b3_dselect_nano"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 4
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "${oc.env:CWAM_ACTIVATION_CHECKPOINTING_MODE,selective}"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [20000]
warm_up_steps = [500]

[trainer]
max_iter        = 20000
logging_iter    = 50
# Four ranks retain B2's effective 512-sample optimizer batch: 4 * 32 * 4.
grad_accum_iter = 4

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
