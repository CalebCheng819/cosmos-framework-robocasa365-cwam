# B4: retain B3's maximum 32-selector DSelect-k capacity while choosing a
# per-sample active prefix from {4, 8, 12, 16, 24, 32}. The batch-mean target
# is 24 selectors; action loss remains free to allocate more to hard samples.

[job]
task         = "vfm"
experiment   = "action_policy_robocasa365_b4_adaptive_dselect_nano"
project      = "cosmos3_action_robocasa365"
group        = "action_sft"
name         = "action_policy_robocasa365_b4_adaptive_dselect_nano"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "${oc.env:CWAM_ACTIVATION_CHECKPOINTING_MODE,selective}"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [20000]
warm_up_steps = [500]

[trainer]
max_iter        = 20000
logging_iter    = 50
# Eight ranks retain B2/B3's effective 512-sample optimizer batch: 8 * 32 * 2.
grad_accum_iter = 2

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
