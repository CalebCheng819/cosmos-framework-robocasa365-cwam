# Continue the four-suite LIBERO S1 policy from optimizer step 500 to 100,000.
# Step 500 is the end of the original warmup, so the replacement schedule starts
# at the same 5e-5 learning rate and linearly decays over the remaining 99,500 steps.

[job]
task         = "vfm"
experiment   = "action_policy_libero_all_s1_nano"
project      = "cwam_action_libero"
group        = "action_sft"
name         = "action_policy_libero_all_s1_cont100k_nano"
wandb_mode   = "offline"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 4
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [99500]
warm_up_steps = [0]
f_start = [1.0]
f_max = [1.0]
f_min = [0.0]

[trainer]
max_iter        = 100000
logging_iter    = 10
grad_accum_iter = 4

[checkpoint]
load_path = "${oc.env:RESUME_CHECKPOINT_PATH}"
save_iter = 1000
